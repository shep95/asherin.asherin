    <!--
      Content-Security-Policy lives only in the response headers (vercel.json).
      The public pages get an https-only policy and the workspace adds the
      local model runtimes on localhost; a meta copy here would apply to both
      and either loosen the public pages or cut the workspace off from them.
    -->
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(self), microphone=(self), geolocation=(self), usb=(), serial=(), midi=(), magnetometer=(self), gyroscope=(self), accelerometer=(self), interest-cohort=()"
