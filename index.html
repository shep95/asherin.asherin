    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Content-Security-Policy, meta layer. The served header (vercel.json) is
      the enforced copy; this one covers any host that serves the folder as
      plain static files. No inline scripts exist; script-src is self plus the one cdn the eye, arvision, ide and sentinel rooms load their engines from.
      connect-src allows any https host (the rooms read public apis, and a
      device key can point at any model provider) plus the local model
      runtimes over http and websockets; plain http to the internet stays
      blocked.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' blob: data: https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(self), microphone=(self), geolocation=(self), usb=(), serial=(), midi=(), magnetometer=(self), gyroscope=(self), accelerometer=(self), interest-cohort=()"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
